services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [studio]

  app:
    image: ghcr.io/azores24839/sci-ai-studio:${STUDIO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - ${STUDIO_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3011"
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD}@postgres:5432/studio
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL must include /studio}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
    ports:
      - "${STUDIO_BIND_IP:-127.0.0.1}:${STUDIO_PORT:-3010}:80"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${STUDIO_MEMORY_LIMIT:-3g}
    cpus: ${STUDIO_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [studio]

volumes:
  studio-postgres:

networks:
  studio:
    name: studio
