services:
  sci-viz-hub:
    image: ghcr.io/azores24839/sci-viz-case-hub:${CASE_HUB_IMAGE_TAG:?CASE_HUB_IMAGE_TAG must be an immutable tested SHA tag}
    container_name: sci-viz-hub
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - ${CASE_HUB_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: file:/app/sci-viz-case-hub/server/prisma/dev.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the production .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in the production .env file}
      STUDIO_SERVICE_KEY: ${STUDIO_SERVICE_KEY:?STUDIO_SERVICE_KEY must be set in the production .env file}
    ports:
      - "${CASE_HUB_BIND_IP:-127.0.0.1}:${CASE_HUB_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ${CASE_HUB_DATA_DIR:-./data}/prisma
        target: /app/sci-viz-case-hub/server/prisma
      - type: bind
        source: ${CASE_HUB_DATA_DIR:-./data}/uploads
        target: /app/sci-viz-case-hub/server/uploads
      - type: bind
        source: ${CASE_HUB_DATA_DIR:-./data}/journal_covers
        target: /app/journal_covers
      - type: bind
        source: ${CASE_HUB_DATA_DIR:-./data}/backups
        target: /app/sci-viz-case-hub/server/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: ${CASE_HUB_CPUS:-1.5}
    mem_limit: ${CASE_HUB_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - case-hub

networks:
  case-hub:
    name: case-hub
