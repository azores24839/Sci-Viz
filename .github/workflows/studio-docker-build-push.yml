name: Build, Push and Deploy Sci AI Studio

on:
  push:
    branches: [main]
    paths:
      - "sci-viz-studio/**"
      - ".github/workflows/studio-docker-build-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azores24839/sci-ai-studio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sci-viz-studio
          file: ./sci-viz-studio/deploy/Dockerfile.app
          push: true
          build-args: |
            VITE_BASE_URL=/studio/
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.STUDIO_CLERK_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: ${{ vars.STUDIO_SSH_HOST != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.STUDIO_SSH_HOST }}
          username: ${{ vars.STUDIO_SSH_USERNAME }}
          key: ${{ secrets.STUDIO_SSH_PRIVATE_KEY }}
          port: ${{ vars.STUDIO_SSH_PORT || '22' }}
          source: "sci-viz-studio/docker-compose.prod.yml"
          target: ${{ vars.STUDIO_COMPOSE_DIR }}
          strip_components: 1
      - name: Pull and restart Studio
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STUDIO_SSH_HOST }}
          username: ${{ vars.STUDIO_SSH_USERNAME }}
          key: ${{ secrets.STUDIO_SSH_PRIVATE_KEY }}
          port: ${{ vars.STUDIO_SSH_PORT || '22' }}
          script: |
            set -eu
            cd ${{ vars.STUDIO_COMPOSE_DIR }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
